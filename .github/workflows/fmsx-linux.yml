name: fMSX Linux build and slot regression
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build stock fMSX libretro core (no Pico firmware required)
        run: make --jobs=2 platform=unix
      - name: Compile pure slot selection tests
        run: gcc -std=c11 -Wall -Wextra -Werror -IfMSX tests/test_slot_logic.c -o /tmp/fmsx-test-slots
      - name: Run slot selection tests
        run: /tmp/fmsx-test-slots
      - name: Exercise actual fMSX memory reads and writes at FFFFh
        run: python3 tests/smoke_slots.py fmsx_libretro.so
      - name: Check MSX2+ and 2 MiB host defaults
        run: python3 tests/smoke_msx2p_profile.py fmsx_libretro.so
      - name: Verify Panasonic turbo switched I/O and CPU timings
        run: python3 tests/smoke_panasonic_turbo.py fmsx_libretro.so
      - name: Install SDL2 for standalone Ubuntu frontend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev
      - name: Build native SDL2 GUI (no RetroArch)
        run: make -f Makefile.ubuntu
      - name: Verify standalone window and dynamic title without a display server
        run: |
          ./fmsx-ubuntu --help
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./fmsx-ubuntu --self-test-window
      - name: Inspect shared-library dependencies
        run: ldd -r fmsx_libretro.so
